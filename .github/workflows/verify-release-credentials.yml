name: Verify release credentials without publication

on:
  workflow_dispatch:
    inputs:
      purpose:
        description: Read-only authentication and credential metadata check
        type: choice
        options: [automation, macos, windows, notarize, manifest]
        default: automation

permissions:
  contents: read

concurrency:
  group: release-credentials-${{ inputs.purpose }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the selected credential purpose
    if: github.repository == 'P4suta/youarel' && github.ref == 'refs/heads/main'
    runs-on: ${{ (inputs.purpose == 'macos' || inputs.purpose == 'notarize') && 'macos-26' || inputs.purpose == 'windows' && 'windows-2025' || 'ubuntu-26.04' }}
    timeout-minutes: 15
    environment: ${{ inputs.purpose == 'automation' && 'release-please' || format('release-{0}', inputs.purpose) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: rust gh
          cache: false
      - name: Compile the reviewed checker without credentials
        run: cargo build --locked --package xtask
      - name: Reject missing inputs and unresolved references
        shell: bash
        env:
          PURPOSE: ${{ inputs.purpose }}
          RELEASE_PLEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
          RELEASE_PLEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_INSTALLER_CERTIFICATE: ${{ secrets.APPLE_INSTALLER_CERTIFICATE }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
          APPLE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          SSLDOTCOM_USERNAME: ${{ secrets.SSLDOTCOM_USERNAME }}
          SSLDOTCOM_PASSWORD: ${{ secrets.SSLDOTCOM_PASSWORD }}
          SSLDOTCOM_CREDENTIAL_ID: ${{ secrets.SSLDOTCOM_CREDENTIAL_ID }}
          SSLDOTCOM_TOTP_SECRET: ${{ secrets.SSLDOTCOM_TOTP_SECRET }}
          RELEASE_MINISIGN_KEY: ${{ secrets.RELEASE_MINISIGN_KEY }}
          RELEASE_MINISIGN_PASSWORD: ${{ secrets.RELEASE_MINISIGN_PASSWORD }}
          RELEASE_ML_DSA_KEY: ${{ secrets.RELEASE_ML_DSA_KEY }}
        run: ./target/debug/xtask release credential-inputs "$PURPOSE"
      - name: Mint a read-only App token for the destination repository
        id: app
        if: inputs.purpose == 'automation'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
      - name: Verify App access without repository writes
        if: inputs.purpose == 'automation'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RELEASE_PLEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
          RELEASE_PLEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
        run: ./target/debug/xtask release verify-credentials automation
      - name: Verify Apple identities and manifest key inputs without signing
        if: inputs.purpose != 'automation' && inputs.purpose != 'windows'
        shell: bash
        env:
          PURPOSE: ${{ inputs.purpose }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_INSTALLER_CERTIFICATE: ${{ secrets.APPLE_INSTALLER_CERTIFICATE }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
          APPLE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          RELEASE_MINISIGN_KEY: ${{ secrets.RELEASE_MINISIGN_KEY }}
          RELEASE_MINISIGN_PASSWORD: ${{ secrets.RELEASE_MINISIGN_PASSWORD }}
          RELEASE_ML_DSA_KEY: ${{ secrets.RELEASE_ML_DSA_KEY }}
        run: ./target/debug/xtask release verify-credentials "$PURPOSE"
      - name: Verify SSL.com credential metadata without a signature request
        if: inputs.purpose == 'windows'
        uses: SSLcom/esigner-codesign@cf5f6c1d38ad10f47e3ed9aca873f429b1a8d85b # v1.3.2
        with:
          command: credential_info
          signing_method: v2
          username: ${{ secrets.SSLDOTCOM_USERNAME }}
          password: ${{ secrets.SSLDOTCOM_PASSWORD }}
          credential_id: ${{ secrets.SSLDOTCOM_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.SSLDOTCOM_TOTP_SECRET }}
          environment_name: PROD
