name: release-plz

# The proposal runs only while the repository variable RELEASES_ENABLED is `true` and the release-plz App is configured.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

env:
  MISE_AUTO_INSTALL: "false"
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  release-pr:
    name: keep the release pull request
    if: github.repository == 'P4suta/youarel' && vars.RELEASES_ENABLED == 'true' && vars.RELEASE_PLZ_APP_CLIENT_ID != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    environment: release-plz
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Mint the App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_PLZ_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: rust
          cache: false
      - uses: release-plz/action@8921286633dfa0c4020f7f30bd1c14fe19cbb10e # v0.5.142
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
