[profile.default]
test-threads = 4
slow-timeout = { period = "120s", terminate-after = 3 }
fail-fast = false
status-level = "fail"
final-status-level = "fail"
leak-timeout = { period = "1s", result = "fail" }

# Miri interprets each test about a hundred times slower, so a test that outlives two minutes is ended and named.
[profile.miri]
test-threads = 4
slow-timeout = { period = "60s", terminate-after = 2 }
fail-fast = true
status-level = "fail"
final-status-level = "fail"
