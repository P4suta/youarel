# What owns each code shape that the shape catalog of `~/.config/assure/shapes.toml` finds in this repository, and the budgets no change may weaken.
# Each rule module of crates/youarel-core owns its decisions through its own Kani harnesses, so only the other shapes need an entry.

[[owner]]
shape = "parser"
path = "crates/youarel-link/src/lib.rs"
by = "fuzz/fuzz_targets/link_parse.rs"

[[owner]]
shape = "parser"
path = "crates/youarel-store/src/codec.rs"
by = "fuzz/fuzz_targets/state_decode.rs"

[[owner]]
shape = "parser"
path = "crates/youarel-html/src/bookmarks.rs"
by = "fuzz/fuzz_targets/bookmarks_parse.rs"

[[owner]]
shape = "parser"
path = "crates/youarel-core/src/position_rules.rs"
by = "fuzz/fuzz_targets/position_key.rs"

[[owner]]
shape = "parser"
path = "crates/youarel-core/src/update_rules.rs"
by = "fuzz/fuzz_targets/version_parse.rs"

[[owner]]
shape = "parser"
path = "crates/youarel-release/src/manifest.rs"
by = "fuzz/fuzz_targets/release_manifest.rs"

[[owner]]
shape = "parser"
path = "crates/youarel-html/src/scan.rs"
by = "fuzz/fuzz_targets/html_scan.rs"

[[owner]]
shape = "parser"
path = "crates/youarel-protocol/src/message.rs"
by = "fuzz/fuzz_targets/wire_decode.rs"

[[owner]]
shape = "parser"
path = "crates/youarel-crypto/src/pairing.rs"
by = "fuzz/fuzz_targets/invitation_code.rs"

[[owner]]
shape = "protocol"
path = "crates/youarel-core/src/ui_rules.rs"
by = "crates/youarel-cli/tests/ui_replay.rs"

[[budget]]
name = "unsafe-sites"
ceiling = 0

# The mutation campaign of `just proofs` over the pure crates leaves no mutant alive and none timed out.
[[budget]]
name = "mutants-missed"
ceiling = 0

[[budget]]
name = "mutants-timed-out"
ceiling = 0
