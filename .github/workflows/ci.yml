name: ci

on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MISE_AUTO_INSTALL: "false"
  MISE_TASK_RUN_AUTO_INSTALL: "false"
  CI_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || '' }}
  CI_FULL: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  plan:
    name: plan
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      app: ${{ steps.plan.outputs.app }}
      macos: ${{ steps.plan.outputs.macos }}
      windows: ${{ steps.plan.outputs.windows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: youarel-plan-v3
          cache-bin: false
      - id: plan
        run: cargo xtask ci plan

  check:
    name: check
    needs: [plan]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      CI_PLAN: ${{ needs.plan.outputs.plan }}
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: rust node npm:typescript github:tauri-apps/tauri taplo typos actionlint zizmor aqua:EmbarkStudios/cargo-deny aqua:rustsec/rustsec/cargo-audit aqua:nextest-rs/nextest/cargo-nextest
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: youarel-check-v3
          cache-bin: false
      - id: app-cache
        if: needs.plan.outputs.app == 'true'
        run: cargo xtask ci cache app
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: needs.plan.outputs.app == 'true'
        with:
          path: ${{ steps.app-cache.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.app-cache.outputs.key }}-${{ hashFiles('app/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-${{ steps.app-cache.outputs.key }}-
      - run: cargo xtask ci run check
      - name: Read the completed window cache as the runner
        if: needs.plan.outputs.app == 'true'
        run: cargo nextest run --locked --package xtask --run-ignored only -E 'test(app::cache::tests::hosted_compiler_outputs_are_readable_by_the_runner)'

  app:
    name: app
    needs: [plan]
    if: github.event_name == 'workflow_dispatch' && needs.plan.outputs.app == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      CI_PLAN: ${{ needs.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: rust node npm:typescript aqua:nextest-rs/nextest/cargo-nextest
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: youarel-ci-v2
          cache-bin: false
      - id: app-cache
        run: cargo xtask ci cache app
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.app-cache.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.app-cache.outputs.key }}-${{ hashFiles('app/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-${{ steps.app-cache.outputs.key }}-
      - run: cargo xtask ci run app
      - name: Read the completed window cache as the runner
        run: cargo nextest run --locked --package xtask --run-ignored only -E 'test(app::cache::tests::hosted_compiler_outputs_are_readable_by_the_runner)'

  macos:
    name: macos
    needs: [plan]
    if: needs.plan.outputs.macos == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      CI_PLAN: ${{ needs.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: rust node npm:typescript github:tauri-apps/tauri aqua:nextest-rs/nextest/cargo-nextest
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: youarel-ci-v2
          cache-bin: false
      - run: cargo xtask ci run macos

  windows:
    name: windows
    needs: [plan]
    if: needs.plan.outputs.windows == 'true'
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CI_PLAN: ${{ needs.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: rust node npm:typescript github:tauri-apps/tauri aqua:nextest-rs/nextest/cargo-nextest
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: youarel-ci-v2
          cache-bin: false
      - run: cargo xtask ci run windows

  ci-success:
    name: ci-success
    if: always()
    needs: [plan, check, app, macos, windows]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      CI_PLAN: ${{ needs.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: rust
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: youarel-plan-v3
          cache-bin: false
      - name: Require every selected job
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: cargo xtask ci gate ci

  required:
    name: required
    if: always()
    needs: [ci-success]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require the complete CI gate
        env:
          CI_RESULT: ${{ needs.ci-success.result }}
        run: test "$CI_RESULT" = success
