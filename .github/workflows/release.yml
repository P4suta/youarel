name: Desktop release candidate

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Stop after unsigned candidates or produce signed distributions
        type: choice
        options: [candidate, sign]
        default: candidate
      source:
        description: Exact main commit SHA, also used by the release controller
        type: string
        required: true
      version:
        description: Reserved product version without the v prefix
        type: string
        required: true
      checked_tree:
        description: Git tree reported by successful local release-check (candidate only)
        type: string
      candidate_run:
        description: Successful unsigned candidate run to consume (sign only)
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.version }}
  cancel-in-progress: false

env:
  MISE_AUTO_INSTALL: "false"
  MISE_TASK_RUN_AUTO_INSTALL: "false"
  RELEASE_SOURCE_SHA: ${{ inputs.source }}
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_BUILD_RUN: ${{ github.run_id }}
  RELEASE_CHECKED_TREE: ${{ inputs.checked_tree }}
  RELEASE_CANDIDATE_RUN: ${{ inputs.candidate_run }}
  RELEASES_ENABLED: ${{ vars.RELEASES_ENABLED }}
  WINDOWS_SIGNING_IDENTITY_SHA256: ${{ vars.WINDOWS_SIGNING_IDENTITY_SHA256 }}
  MACOS_APPLICATION_IDENTITY_SHA1: ${{ vars.MACOS_APPLICATION_IDENTITY_SHA1 }}
  MACOS_INSTALLER_IDENTITY_SHA1: ${{ vars.MACOS_INSTALLER_IDENTITY_SHA1 }}

jobs:
  check:
    name: Verify the requested release
    if: github.repository == 'P4suta/youarel' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read # Read the selected source without modifying the repository.
      actions: read # Verify the original candidate before signing.
    outputs:
      candidate_run: ${{ steps.plan.outputs.candidate_run }}
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: rust node npm:typescript taplo typos actionlint zizmor gh aqua:EmbarkStudios/cargo-deny aqua:rustsec/rustsec/cargo-audit aqua:nextest-rs/nextest/cargo-nextest
          cache: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: youarel-check-v3
          cache-bin: false
      - name: Show and validate the requested operation
        id: plan
        env:
          OPERATION: ${{ inputs.operation }}
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask release plan "$OPERATION"
      - name: Check portable shipping behavior
        if: inputs.operation == 'candidate'
        run: cargo xtask ci check

  build:
    name: Build ${{ matrix.target }}
    if: inputs.operation == 'candidate'
    needs: [check]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read # Reuse the selected run's verified native artifacts.
      id-token: write # Attest unsigned candidate bytes before signing.
      attestations: write # Preserve the original native build provenance.
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-26
            target: aarch64-apple-darwin
          - os: macos-26-intel
            target: x86_64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf xvfb xauth xdotool dbus-x11 at-spi2-core
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: rust node npm:typescript npm:@tauri-apps/cli cargo:cargo-cyclonedx gh aqua:nextest-rs/nextest/cargo-nextest
          cache: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: youarel-release-${{ matrix.target }}
          cache-bin: false
          workspaces: |
            . -> target
            app -> target
      - name: Add the native target
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"
      - name: Restore a verified native candidate when available
        id: resume
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask release resume-build "$TARGET"
      - name: Check native behavior
        if: steps.resume.outputs.reused != 'true'
        run: cargo xtask check --desktop
      - name: Build and verify both programs without release credentials
        if: steps.resume.outputs.reused != 'true'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo xtask release build "$TARGET"
          cargo xtask release seal "$TARGET"
      - name: Package and inspect the native candidate
        if: steps.resume.outputs.distribution != 'true'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo xtask release bundle "$TARGET"
          cargo xtask release check-bundle "$TARGET"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: provenance
        if: steps.resume.outputs.reused != 'true'
        with:
          subject-path: |
            release-candidate/payload.tar.gz
            release-candidate/candidate.json
            dist/*.cdx.json
      - name: Preserve and verify original build provenance
        if: steps.resume.outputs.reused != 'true'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask release attach-build-provenance "$TARGET" "$PROVENANCE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.resume.outputs.reused != 'true'
        with:
          name: candidate-${{ matrix.target }}
          path: release-candidate/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.resume.outputs.distribution != 'true'
        with:
          name: unsigned-dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  sign:
    name: Sign ${{ matrix.target }}
    if: inputs.operation == 'sign'
    needs: [check]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    environment: release-${{ matrix.platform }}
    permissions:
      contents: read
      actions: read # Inspect prior attempts and preserve original signing outputs.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            target: aarch64-apple-darwin
            platform: macos
          - os: macos-26-intel
            target: x86_64-apple-darwin
            platform: macos
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            platform: windows
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            platform: windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: rust gh
          cache: false
      - name: Compile the trusted controller before fetching credentials
        run: cargo build --locked --package xtask
      - name: Prepare the pinned Windows signing tool without credentials
        if: runner.os == 'Windows'
        shell: bash
        run: ./target/debug/xtask release prepare-windows
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-${{ matrix.target }}
          path: release-candidate
          run-id: ${{ needs.check.outputs.candidate_run }}
          github-token: ${{ github.token }}
      - name: Verify and restore the original candidate without executing it
        id: resume
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          GH_TOKEN: ${{ github.token }}
          WINDOWS_SIGNING_IDENTITY_SHA256: ${{ vars.WINDOWS_SIGNING_IDENTITY_SHA256 }}
        run: |
          ./target/debug/xtask release restore "$TARGET"
          ./target/debug/xtask release stage-windows "$TARGET"
          ./target/debug/xtask release resume-windows "$TARGET"
      - name: Sign nested macOS programs and the application
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_INSTALLER_CERTIFICATE: ${{ secrets.APPLE_INSTALLER_CERTIFICATE }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          ./target/debug/xtask release credential-inputs macos
          ./target/debug/xtask release sign-macos program "$TARGET"
      - name: Validate resolved Windows signing inputs
        if: runner.os == 'Windows' && steps.resume.outputs.reused != 'true'
        shell: bash
        env:
          SSLDOTCOM_USERNAME: ${{ secrets.SSLDOTCOM_USERNAME }}
          SSLDOTCOM_PASSWORD: ${{ secrets.SSLDOTCOM_PASSWORD }}
          SSLDOTCOM_CREDENTIAL_ID: ${{ secrets.SSLDOTCOM_CREDENTIAL_ID }}
          SSLDOTCOM_TOTP_SECRET: ${{ secrets.SSLDOTCOM_TOTP_SECRET }}
        run: ./target/debug/xtask release credential-inputs windows
      - name: Sign and timestamp the Windows programs together
        id: esigner
        if: runner.os == 'Windows' && steps.resume.outputs.reused != 'true'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          SSLDOTCOM_USERNAME: ${{ secrets.SSLDOTCOM_USERNAME }}
          SSLDOTCOM_PASSWORD: ${{ secrets.SSLDOTCOM_PASSWORD }}
          SSLDOTCOM_CREDENTIAL_ID: ${{ secrets.SSLDOTCOM_CREDENTIAL_ID }}
          SSLDOTCOM_TOTP_SECRET: ${{ secrets.SSLDOTCOM_TOTP_SECRET }}
        run: ./target/debug/xtask release sign-windows "$TARGET"
      - name: Preserve Windows provider outputs before packaging
        if: always() && runner.os == 'Windows' && ((steps.esigner.outcome != '' && steps.esigner.outcome != 'skipped') || steps.resume.outputs.reused == 'true')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-signatures-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            signing-input/*.exe
            release-candidate/candidate.json
          if-no-files-found: error
          retention-days: 90
      - name: Check both Windows publishers and timestamps
        if: runner.os == 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          WINDOWS_SIGNING_IDENTITY_SHA256: ${{ vars.WINDOWS_SIGNING_IDENTITY_SHA256 }}
        run: ./target/debug/xtask release accept-windows "$TARGET"
      - name: Package the signed bytes without candidate hooks
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: ./target/debug/xtask release bundle "$TARGET"
      - name: Sign the macOS installer
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_INSTALLER_CERTIFICATE: ${{ secrets.APPLE_INSTALLER_CERTIFICATE }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
          APPLE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
        run: ./target/debug/xtask release sign-macos package "$TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  notarize:
    name: Notarize signed installers
    if: inputs.operation == 'sign'
    needs: [sign]
    runs-on: macos-26
    timeout-minutes: 150
    environment: release-notarize
    permissions:
      contents: read
      actions: read # Resume the original submission receipts and package bytes.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: rust
          cache: false
      - run: cargo build --locked --package xtask
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: signed-dist-*-apple-darwin
          merge-multiple: true
          path: dist
      - name: Reconcile and restore previous notarization attempts
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./target/debug/xtask release resume-notarization
      - name: Submit each original signed package once
        env:
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          ./target/debug/xtask release credential-inputs notarize
          ./target/debug/xtask release notarize submit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: notarization-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/notarization/
            dist/*.pkg
          if-no-files-found: error
          retention-days: 90
      - name: Wait, staple, validate, and assess both installers
        env:
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: ./target/debug/xtask release notarize finish
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notarized-dist
          path: dist/*.pkg
          if-no-files-found: error
          retention-days: 30

  install:
    name: Install ${{ matrix.target }}
    if: inputs.operation == 'sign'
    needs: [check, sign, notarize]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read # Read the trusted installation controller.
      actions: read # Download unsigned Linux packages from the original candidate run.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: unsigned-dist-x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: unsigned-dist-aarch64-unknown-linux-gnu
          - os: macos-26
            target: aarch64-apple-darwin
            artifact: notarized-dist
          - os: macos-26-intel
            target: x86_64-apple-darwin
            artifact: notarized-dist
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            artifact: signed-dist-x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            artifact: signed-dist-aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install declared Linux desktop runtimes
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-0 libayatana-appindicator3-1 libxdo3
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: rust
          cache: false
      - name: Compile the controller without platform credentials
        run: cargo build --locked --package xtask
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: runner.os != 'Linux'
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: runner.os == 'Linux'
        with:
          name: ${{ matrix.artifact }}
          path: dist
          run-id: ${{ needs.check.outputs.candidate_run }}
          github-token: ${{ github.token }}
      - name: Exercise the distributed installation on a fresh native runner
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          WINDOWS_SIGNING_IDENTITY_SHA256: ${{ vars.WINDOWS_SIGNING_IDENTITY_SHA256 }}
        run: ./target/debug/xtask release install-check "$TARGET"

  assemble:
    name: Assemble verified distributions
    if: inputs.operation == 'sign'
    needs: [check, sign, notarize, install]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment: release-manifest
    permissions:
      # Assembly reads source metadata without changing the repository.
      contents: read
      actions: read # Reuse a complete distribution without signing it again.
      id-token: write # Attest final asset hashes.
      attestations: write # Store provenance for the completed distribution.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: rust
          cache: false
      - run: cargo build --locked --package xtask
      - name: Reuse the original complete distribution when available
        id: resume
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./target/debug/xtask release resume-distribution
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.resume.outputs.reused != 'true'
        with:
          pattern: unsigned-dist-*-linux-gnu
          merge-multiple: true
          path: dist
          run-id: ${{ needs.check.outputs.candidate_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.resume.outputs.reused != 'true'
        with:
          pattern: signed-dist-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.resume.outputs.reused != 'true'
        with:
          name: notarized-dist
          path: dist
      - name: Sign the complete final asset inventory
        if: steps.resume.outputs.reused != 'true'
        env:
          RELEASE_MINISIGN_KEY: ${{ secrets.RELEASE_MINISIGN_KEY }}
          RELEASE_MINISIGN_PASSWORD: ${{ secrets.RELEASE_MINISIGN_PASSWORD }}
          RELEASE_ML_DSA_KEY: ${{ secrets.RELEASE_ML_DSA_KEY }}
        run: |
          ./target/debug/xtask release credential-inputs manifest
          ./target/debug/xtask release record-distribution
          ./target/debug/xtask release manifest
          ./target/debug/xtask release sign
          ./target/debug/xtask release checksums
          ./target/debug/xtask release verify-dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: provenance
        if: steps.resume.outputs.reused != 'true'
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Preserve the original build provenance
        if: steps.resume.outputs.reused != 'true'
        env:
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
        run: ./target/debug/xtask release attach-provenance "$PROVENANCE"
      - name: Verify every attested artifact before handoff
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./target/debug/xtask release verify-provenance
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.resume.outputs.reused != 'true'
        with:
          name: release-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 90
