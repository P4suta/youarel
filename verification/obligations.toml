  { name = "proofs::synthetic_identifiers_never_alias_across_indices_or_namespaces", covers = 2, contract = "synthetic version-seven identifiers preserve every counter bit and separate all six fixture namespaces, regardless of timestamps", input_domain = "all six namespaces, every u64 index, and every u64 timestamp", bound = "sixteen-byte comparisons unwind at seventeen" },
  { name = "proofs::resource_limits_stop_before_the_next_reserved_write", covers = 5, contract = "a campaign continues only before its deadline, without cancellation, within its synthetic storage bound and with its free-space floor including a write reserve", input_domain = "every u64 storage, free-space and elapsed-time value and cancellation flag", bound = "complete; the adapter supplies measured filesystem and monotonic-clock facts between bounded operations" },
]
probes = [
