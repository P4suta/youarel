name: warm-ci-caches

on:
  workflow_dispatch:

concurrency:
  group: warm-ci-caches-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MISE_AUTO_INSTALL: "false"
  MISE_TASK_RUN_AUTO_INSTALL: "false"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  warm:
    name: warm
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: rust aqua:nextest-rs/nextest/cargo-nextest
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: youarel-check-v3
          cache-bin: false
      - id: app-cache
        run: cargo xtask ci cache app
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.app-cache.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.app-cache.outputs.key }}-${{ hashFiles('app/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-${{ steps.app-cache.outputs.key }}-
      - run: cargo xtask app-linux
      - name: Read the completed window cache as the runner
        run: cargo nextest run --locked --package xtask --run-ignored only -E 'test(app::cache::tests::hosted_compiler_outputs_are_readable_by_the_runner)'
