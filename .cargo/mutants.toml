# cargo-mutants reads this file, and `just proofs` runs one campaign per pure crate with `--package` and `--test-package`.
# Fixed timeouts keep the outcome independent of how fast a host runs the unmutated tests.
timeout_multiplier = 3.0
minimum_test_timeout = 20.0
exclude_re = [
  # Exempt as no-decision: each `proofs` module holds only the specifications and harnesses that test the rules.
  # The probes of the proof gate show they fail when weakened.
  # Evidence: `xtask/src/proofs.rs`.
  # Reconsider when a rule module keeps production code in `proofs`.
  "proofs::",
  # Exempt as equivalent: `|` and `^` agree on bits that do not overlap.
  # The version and variant marks of an identifier sit above the random bits they join, a high nibble sits above a low one, and a code symbol's five bits join a value shifted left by five.
  # Evidence: the tests of `ItemId::v7`, `unhex`, `Digest::parse`, and `Code::parse` fix every bit of their results.
  # Reconsider when one of these joins operands that can share a bit.
  "replace \\| with \\^ in (ItemId::v7|unhex|Digest::parse|Code::parse)",
]
exclude_globs = [
  # Exempt as other-platform: the campaign runs on Linux, which never builds this Windows-only code, so its mutants would pass unbuilt.
  # Evidence: `just check-win` runs the program replacement test on Windows.
  # Reconsider when the campaign runs on a Windows host too.
  "crates/youarel-store/src/fs/windows.rs",
  # Exempt as other-configuration: the campaign builds each crate with its default features, which leave the local relay out, so its mutants would pass unbuilt.
  # Evidence: `crates/youarel-cli/tests/relay_e2e.rs` serves this relay over HTTP and pairs and syncs three devices through it.
  # Reconsider when the campaign builds every feature of a crate.
  "crates/youarel-relay/src/local.rs",
]
