[tools]
rust = { version = "1.99.0", components = [
  "clippy",
  "rustfmt",
], targets = [
  "thumbv7em-none-eabi",
  "wasm32-unknown-unknown",
] }
just = "1.58.0"
taplo = "0.10.0"
typos = "1.50.3"
lefthook = "2.1.15"
actionlint = "1.7.12"
zizmor = "1.30.1"
"aqua:crate-ci/committed" = "1.1.11"
"aqua:EmbarkStudios/cargo-deny" = "0.20.2"
"aqua:rustsec/rustsec/cargo-audit" = "0.22.2"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.146"
"cargo:kani-verifier" = { version = "0.68.0", os = ["macos", "linux"] }
"cargo:cargo-mutants" = { version = "27.1.0", os = ["macos", "linux"] }
"cargo:cargo-fuzz" = { version = "0.13.2", os = ["macos", "linux"] }
gh = "2.102.0"

[settings]
lockfile = true
