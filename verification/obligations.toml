# Every verification obligation of this repository, which `just proofs` discharges and `just check` holds to the source.
# Each rule module of crates/youarel-core has one Kani obligation: every harness it defines must pass with the covers it declares, and every `rejects_*` probe must fail on its named assertion.
# A harness names its contract, the inputs it admits, and the bound it proves to, so a reader can tell a complete proof from a bounded one.

[[obligation]]
verifier = "kani"
source = "crates/youarel-core/src/device_rules.rs"
harnesses = [
  { name = "proofs::short_name_admission_matches_edges_and_control_code_points", covers = 3, contract = "short names are admitted exactly when their edges are not whitespace and they contain no C0 or C1 control code point", input_domain = "every valid UTF-8 prefix of up to four arbitrary bytes", bound = "four UTF-8 bytes; the independent control predicate uses Unicode Cc ranges" },
  { name = "proofs::name_length_admission_matches_the_byte_limit", covers = 2, contract = "name byte lengths are admitted exactly up to 128 bytes", input_domain = "every usize byte length", bound = "the target's full usize domain, including both sides of the 128-byte boundary" },
]
probes = [
  { harness = "proofs::rejects_a_name_with_a_control_character", assertion = "NEGATIVE_DEVICE_CONTROL" },
]

