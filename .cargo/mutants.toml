# cargo-mutants reads this file, and `just proofs` runs one campaign per pure crate with `--package` and `--test-package`.
timeout_multiplier = 3.0
minimum_test_timeout = 60.0
exclude_re = [
  # Exempt as no-decision: each `proofs` module holds only the specifications and harnesses that test the rules.
  # The probes of the proof gate show they fail when weakened.
  # Evidence: `xtask/src/proofs.rs`.
  # Reconsider when a rule module keeps production code in `proofs`.
  "proofs::",
  # Exempt as equivalent: `|` and `^` agree on bits that do not overlap.
  # The version and variant marks of an identifier sit above the random bits they join, and a high nibble sits above a low one.
  # Evidence: the tests of `ItemId::v7`, the store's `unhex` over `from_hex`, and `Digest::parse` fix every bit of their results.
  # Reconsider when one of these joins operands that can share a bit.
  "replace \\| with \\^ in (ItemId::v7|unhex|from_hex|Digest::parse)",
]
exclude_globs = [
  # Exempt as other-platform: the campaign runs on Linux, which never builds this Windows-only code, so its mutants would pass unbuilt.
  # Evidence: `just check-win` runs the program replacement test on Windows.
  # Reconsider when the campaign runs on a Windows host too.
  "crates/youarel-store/src/fs/windows.rs",
]
