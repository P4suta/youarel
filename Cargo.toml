[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99.0"
license = "MIT OR Apache-2.0"
publish = false
authors = ["Yasunobu"]
readme = "README.md"
repository = "https://github.com/P4suta/youarel"

[workspace.lints.rust]
unsafe_code = "forbid"
non_ascii_idents = "deny"
unfulfilled_lint_expectations = "deny"
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(kani)'] }

unused = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }

missing_debug_implementations = "deny"
missing_copy_implementations = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"
elided_lifetimes_in_paths = "deny"
unused_lifetimes = "deny"
single_use_lifetimes = "deny"
redundant_lifetimes = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
let_underscore_drop = "deny"
meta_variable_misuse = "deny"
unit_bindings = "deny"
variant_size_differences = "deny"
ambiguous_negative_literals = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
bare_urls = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

allow_attributes = "deny"
allow_attributes_without_reason = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
string_slice = "deny"
as_conversions = "deny"
clone_on_ref_ptr = "deny"
lossy_float_literal = "deny"
rc_buffer = "deny"
verbose_file_reads = "deny"
str_to_string = "deny"
mem_forget = "deny"
arithmetic_side_effects = "deny"
cognitive_complexity = "deny"
let_underscore_must_use = "deny"
map_err_ignore = "deny"
panic_in_result_fn = "deny"
unwrap_in_result = "deny"
try_err = "deny"
unused_result_ok = "deny"
create_dir = "deny"
error_impl_error = "deny"
mutex_atomic = "deny"
mutex_integer = "deny"
rc_mutex = "deny"
string_add = "deny"
assertions_on_result_states = "deny"
exit = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
wildcard_enum_match_arm = "deny"
fallible_impl_from = "deny"
shadow_unrelated = "deny"
undocumented_unsafe_blocks = "deny"

# The URL parser's ICU tree derives through syn 3 while serde derives through syn 2, so two versions of a proc-macro crate are unavoidable.
multiple_crate_versions = "allow"

[workspace.dependencies]
youarel-core = { path = "crates/youarel-core" }
youarel-html = { path = "crates/youarel-html" }
youarel-link = { path = "crates/youarel-link" }
youarel-store = { path = "crates/youarel-store" }

anyhow = "1.0"
clap = { version = "4.6", features = ["derive", "wrap_help"] }
getrandom = "0.4"
ratatui = "0.30"
# The operating system verifies certificates, so its trust store and its updates apply and no root bundle ships with the binary.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ureq = { version = "3", default-features = false, features = [
  "gzip",
  "platform-verifier",
  "rustls-no-provider",
] }
webbrowser = "1.2"
proc-macro2 = { version = "1.0", default-features = false, features = ["span-locations"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
syn = { version = "2.0", default-features = false, features = [
  "full",
  "parsing",
  "visit",
  "printing",
  "clone-impls",
] }
tempfile = "3"
toml = { version = "1.0", features = ["preserve_order"] }
url = "2.5"

[profile.test]
debug = 0

[profile.release]
strip = true
lto = true
codegen-units = 1
