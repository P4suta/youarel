# The fuzz targets of every parser entry point, whose committed corpora `just proofs` replays.
[package]
name = "youarel-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
youarel-core = { path = "../crates/youarel-core" }
youarel-link = { path = "../crates/youarel-link" }

[[bin]]
name = "link_parse"
path = "fuzz_targets/link_parse.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
