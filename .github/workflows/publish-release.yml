name: Publish a verified desktop release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Prepare a complete draft or publish the existing verified draft
        type: choice
        options: [draft, publish]
        default: draft
      source:
        description: Original candidate source commit SHA
        type: string
        required: true
      version:
        description: Original reserved product version without the v prefix
        type: string
        required: true
      build_run:
        description: Successful signed Desktop release candidate run ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.version }}
  cancel-in-progress: false

env:
  RELEASE_SOURCE_SHA: ${{ inputs.source }}
  RELEASE_VERSION: ${{ inputs.version }}
  RELEASE_BUILD_RUN: ${{ inputs.build_run }}
  RELEASES_ENABLED: ${{ vars.RELEASES_ENABLED }}

jobs:
  inspect:
    name: Inspect the original signed build
    if: github.repository == 'P4suta/youarel' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # Inspect the original release workflow run.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: rust
          cache: false
      - name: Show publication scope and verify its original run
        env:
          OPERATION: ${{ inputs.operation }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cargo xtask release plan-publication "$OPERATION"
          cargo xtask release verify-build-run

  publication:
    name: Apply the verified publication operation
    needs: [inspect]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment: ${{ inputs.operation == 'draft' && 'release-draft' || 'release-publish' }}
    permissions:
      contents: write # Create the approved draft or publish its complete assets.
      actions: read # Download only the selected original build artifacts.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: rust
          cache: false
      - name: Compile the protected main controller
        run: cargo build --locked --package xtask
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ inputs.build_run }}
          run-id: ${{ inputs.build_run }}
          github-token: ${{ github.token }}
          path: dist
      - name: Recheck the candidate and reconcile remote state before mutation
        env:
          OPERATION: ${{ inputs.operation }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ./target/debug/xtask release verify-build-run
          ./target/debug/xtask release "$OPERATION"
