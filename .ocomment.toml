# Repeats the machine configuration of ocomment, which a hosted runner lacks.
version = 1

# Remove nothing.
[policy]
mode = "none"

# One sentence per line.
[style]
wrap = "sentence"

# Fuzz inputs are bytes under test.
[files]
exclude = ["fuzz/corpus/**", "xtask/proofs/*/corpus/**"]

[[overrides]]
paths = ["justfile"]
language = "shell"
