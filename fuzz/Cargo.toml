# The fuzz targets of every parser entry point, whose committed corpora `just proofs` replays.
[package]
name = "youarel-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
youarel-core = { path = "../crates/youarel-core" }
youarel-html = { path = "../crates/youarel-html" }
youarel-icon = { path = "../crates/youarel-icon" }
youarel-import = { path = "../crates/youarel-import" }
youarel-link = { path = "../crates/youarel-link" }
youarel-release = { path = "../crates/youarel-release" }
youarel-store = { path = "../crates/youarel-store" }
youarel-crypto = { path = "../crates/youarel-crypto" }
youarel-protocol = { path = "../crates/youarel-protocol" }
youarel-theme = { path = "../crates/youarel-theme" }

[[bin]]
name = "link_parse"
path = "fuzz_targets/link_parse.rs"
test = false
doc = false
bench = false

