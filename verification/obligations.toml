# Every verification obligation of this repository, which `just proofs` discharges and `just check` holds to the source.
# Each rule module of crates/youarel-core has one Kani obligation: every harness it defines must pass with the covers it declares, and every `rejects_*` probe must fail on its named assertion.
# A harness names its contract, the inputs it admits, and the bound it proves to, so a reader can tell a complete proof from a bounded one.

[[obligation]]
verifier = "kani"
source = "crates/youarel-core/src/icon_rules.rs"
harnesses = [
  { name = "proofs::cache_roots_preserve_the_hosts_environment_conventions", covers = 3, contract = "cache discovery preserves the platform's explicit environment root and refuses empty or unavailable roots", input_domain = "all six cache browsers, all three host kinds, and unset, empty, and one-byte nonempty classes for each environment value", bound = "complete over the presence classes; native tests cover actual Windows and Unix path values and profile discovery" },
  { name = "proofs::bitmap_preference_keeps_the_largest_small_image_or_the_smallest_large_one", covers = 4, contract = "bitmap dimensions are admitted exactly within bounds and preference chooses the largest size at or below 64 pixels before any larger size, then the smallest larger size", input_domain = "every u32 width and height and every pair of positive square sides up to 4096", bound = "complete; the adapter validates image bytes through the production normalizer" },
  { name = "proofs::admitted_database_sizes_never_overflow_or_pass_the_snapshot_limit", covers = 2, contract = "admitted SQLite page counts and sizes multiply without overflow and fit the snapshot byte limit", input_domain = "every u64 page count and page size", bound = "complete; the SQLite adapter supplies the database facts" },
]
probes = [
  { harness = "proofs::rejects_preferring_a_larger_than_needed_bitmap", assertion = "NEGATIVE_ICON_CONTROL" },
]

