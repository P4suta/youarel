# The fuzz targets of every parser entry point, whose committed corpora `just proofs` replays.
[package]
name = "youarel-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
youarel-core = { path = "../crates/youarel-core" }
youarel-html = { path = "../crates/youarel-html" }
youarel-link = { path = "../crates/youarel-link" }
youarel-release = { path = "../crates/youarel-release" }
youarel-store = { path = "../crates/youarel-store" }

[[bin]]
name = "link_parse"
path = "fuzz_targets/link_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "state_decode"
path = "fuzz_targets/state_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bookmarks_parse"
path = "fuzz_targets/bookmarks_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "html_scan"
path = "fuzz_targets/html_scan.rs"
test = false
doc = false
bench = false

[[bin]]
name = "position_key"
path = "fuzz_targets/position_key.rs"
test = false
doc = false
bench = false

[[bin]]
name = "version_parse"
path = "fuzz_targets/version_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "release_manifest"
path = "fuzz_targets/release_manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "page_title"
path = "fuzz_targets/page_title.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
